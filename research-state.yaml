schema_version: 1
updated: "2026-10-03"
status: modern_pilot_feasibility_passed
phase: phase4a_modern_generalization_pilot
objective: >-
  Test external validity of positive/negative warm-start KD with base SmolLM2
  135M/360M on TinyStories and FineWeb-Edu, seed 42 only, under the authorized
  bounded Phase 4A protocol. Preserve the frozen final evidence and manuscript.
primary_metric: paired_test_nll_gain
selection_metric: validation_nll
secondary_metrics:
  - parameter_count
  - batch_latency_ms
  - tokens_per_second
  - peak_memory_gb
constraints:
  - legacy_experiments_frozen_only_authorized_phase4a_seed42_training
  - do_not_launch_phase2h
  - final_evidence_ledger_is_authoritative
  - heavy_training_remote_only_10_42_0_197
  - smoke_before_full_run
  - do_not_modify_datasets_or_checkpoints
  - preserve_legacy_checkpoints_and_loss_mode
  - phase3a_terminal_no_further_diagnostic_or_method_work
  - phase3b_not_authorized
  - phase4a_no_seeds123_456_without_review
  - phase4a_final_evidence_and_manuscript_immutable
current_baselines:
  teacher_ptb_ppl: 50.1125
  student_quality_ptb_ppl: 51.8431
  student_tradeoff_ptb_ppl: 53.8719
  matched_ptb_ce_mean_ppl: 59.2853
  matched_ptb_token_kd_mean_ppl: 51.2859
  matched_tinystories_ce_seed42_ppl: 4.8611
  matched_tinystories_token_kd_seed42_ppl: 5.4127
  matched_wt2_ce_mean_nll: 4.276364
  matched_wt2_token_kd_mean_nll: 4.120699
  matched_tinystories_ce_mean_nll: 1.582197
  matched_tinystories_token_kd_mean_nll: 1.689416
hypotheses:
  H0:
    title: Token-normalized KD is required for comparable distillation strength
    status: confirmed_protocol_adopted_transfer_domain_dependent
  H1:
    title: Teacher branch disagreement predicts conflict and enables consensus-to-branch routing
    status: diagnostic_gate_passed_but_bounded_crbd_prototype_failed
  H2:
    title: Branch-aligned dual distillation transfers heterogeneous expertise better than fused logits alone
    status: branch_only_control_failed_at_lambda_2_5
  H3:
    title: A Transformer+Grassmann teacher transfers better than a homogeneous Transformer+Transformer ensemble
    status: contradicted_tt_better_three_of_three_seeds
  H4:
    title: TinyStories warm-start KD negative transfer is robust to independent student initialization
    status: confirmed_three_of_three_seeds
  H5:
    title: Validation-risk-aware local curvature at S0 predicts fixed-strength KD transfer
    status: contradicted_diagnostic_failed_no_increment_over_first_order
next_action: >-
  Lock the formal Phase 4A protocol after passing Stage 0, run TinyStories
  seed-42 target preparation and three matched continuations, then FineWeb-Edu
  only if Stage 1 completes cleanly. Audit selected endpoints, commit compact
  artifacts and STOP. Never automatically replicate or edit the manuscript.
blockers:
  - date: "2026-09-16"
    issue: Local system Python cannot import torch because libtorch_python.so is unreadable; training remains remote-only.
resolved_protocol:
  - date: "2026-10-03"
    issue: Phase 3A completed 21 seed-level offline full-parameter diagnostics across seven families. First- and second-order signs were identical on all 63 calibration rows, positive WT2 J/G/TT families were missed, and calibration stability failed. Decision STOP_NEW_METHOD_DIAGNOSTIC_FAILED; no Phase 3B.
  - date: "2026-10-03"
    issue: The final evidence ledger, conservative four-claim set, manuscript tables, old-manuscript audit, and reconstruction blueprint were completed. The authoritative narrative removes Grassmann-specific KD, Plucker-causality, heterogeneity-superiority, strong-JSD, and successful-CRBD claims.
  - date: "2026-10-03"
    issue: Phase 2G confirmed TinyStories warm-start KD negative transfer across independent seeds 42/123/456. Delta_KD was negative for all three (mean -0.107219 NLL, sample SD 0.000415); experiments are now frozen and manuscript rewrite is next.
  - date: "2026-09-30"
    issue: Phase 2F completed the homogeneous ensemble control. TT beat TG for all three students (mean H=-0.012460 NLL); teacher quality and alpha-learning-rate differences remain disclosed confounds, and no Grassmann-specific KD advantage is supported.
  - date: "2026-09-30"
    issue: Phase 2E Transformer-only full-data gate had clip saturation at 1.0. The research lead explicitly authorized unchanged formal training with a permanent CLIP_SATURATION_WARNING; all three runs completed without elevated overflow or non-finite gradients.
  - date: "2026-09-29"
    issue: The original Phase 2D 2000-line smoke failed. After explicit authorization, a matched full-data one-epoch J/A stability gate passed and the unchanged three-seed formal D2 matrix completed.
resolved_infrastructure:
  - date: "2026-09-16"
    issue: Remote /songxin NFS mount was restored; grassmann_lab sees the shared project and four RTX 3090 GPUs.
  - date: "2026-09-16"
    issue: PTB seed-42 initialization path was verified against historical logs and matched configuration; CE/KD runs were relaunched with a 50-minute limit on GPU 0/3.
  - date: "2026-09-16"
    issue: Removed the invalid eager src.data import, corrected the endpoint-harm test fixture, and passed all 10 KD/branch-diagnostic/statistical tests remotely.
