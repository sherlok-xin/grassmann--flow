<svg xmlns="http://www.w3.org/2000/svg" width="6.8in" height="3.400000000in" viewBox="0 0 1774 887" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Teacher architecture</title>
<desc id="figure-description">Final corrected generic architecture. Grassmann path: Token embedding to W_red to causal local pairs (z_t,z_(t−Δ)), Δ in {1,2,4}; causal direction z_(t−Δ) to z_t; Plücker coordinates p_ij; normalized p-hat=p/max(norm(p),epsilon); geometric projection; valid-window mean; gated mixing; LM head; G logits. Late fusion z=alpha z^(T)+(1−alpha)z^(G), with no fixed alpha.</desc>
