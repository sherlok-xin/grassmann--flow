<svg xmlns="http://www.w3.org/2000/svg" width="6.8in" height="3.400000000in" viewBox="0 0 1774 887" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Teacher quality matters, but is not sufficient</title>
<desc id="figure-description">Fixed teacher architecture, T/G composition, and alpha 0.5. Changing teacher state reverses transfer sign. The globally weaker Grassmann-only teacher is worse than the matched CE comparator yet gives positive transfer in three seeds. All reference wording is retained.</desc>
